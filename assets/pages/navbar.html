    <p>Boot up for impossibilities</p>
</div>
<div class="container-main" id="container">
    <div class="brand">
        <a href="#home">
            <img src="/assets/images/logo.png" alt="JonieTech Logo" class="nav-logo">
        </a>
    </div>

    <div class="nav-actions">
        <a href="tel:+256765761948" class="action-btn" title="Call Us">
            <i class="bi bi-telephone-fill"></i>
        </a>
        <a href="https://wa.me/256765761948" class="action-btn" title="WhatsApp">
            <i class="bi bi-whatsapp"></i>
        </a>
        <a href="https://github.com/JONIETECH" class="action-btn" title="GitHub">
            <i class="bi bi-github"></i>
        </a>
    </div>

    <button class="hamburger" id="hamburger-menu" aria-label="Menu">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
    </button>

    <div class="navbar" id="navbar-menu">
        <ul>
            <li><a href="/#home" class="nav-link" data-page="home">Home</a></li>
            <li><a href="/#services" class="nav-link" data-page="services">Our Services</a></li>
            <li><a href="/#technologies" class="nav-link" data-page="technologies">Technologies</a></li>
            <li><a href="/#projects" class="nav-link" data-page="projects">Our Projects</a></li>
            <li><a href="/#contact" class="nav-link" data-page="contact">Contact Us</a></li>
        </ul>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Load navbar functionality
        const hamburger = document.getElementById('hamburger-menu');
        const navbar = document.getElementById('navbar-menu');
        const container = document.getElementById('container');
        const navLinks = document.querySelectorAll('.nav-link');

        // Update links based on current page
        const currentPath = window.location.pathname;
        const isServicePage = currentPath.includes('/assets/pages/');
        
        navLinks.forEach(link => {
            const href = link.getAttribute('href');
            if (isServicePage) {
                // If we're on a service page, update the link to point to the root
                link.setAttribute('href', `/${href.split('#')[1] ? '#' + href.split('#')[1] : ''}`);
            }
        });

        hamburger.addEventListener('click', () => {
            navbar.classList.toggle('active');
            container.classList.toggle('active');
        });

        // Close navbar when clicking outside
        document.addEventListener('click', (e) => {
            if (!navbar.contains(e.target) && !hamburger.contains(e.target)) {
                navbar.classList.remove('active');
                container.classList.remove('active');
            }
        });

        // Smooth scroll to sections
        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const targetId = link.getAttribute('href');
                
                if (targetId === '/') {
                    // If it's the home link, navigate to the root
                    window.location.href = '/';
                } else if (targetId.startsWith('/#')) {
                    // If it's a section link, navigate to the root with the section
                    window.location.href = targetId;
                } else {
                    // Otherwise, smooth scroll to the section
                    const targetSection = document.querySelector(targetId);
                    if (targetSection) {
                        targetSection.scrollIntoView({ behavior: 'smooth' });
                        // Close mobile menu after clicking
                        navbar.classList.remove('active');
                        container.classList.remove('active');
                    }
                }
            });
        });

        // Add active class to current section
        const sections = document.querySelectorAll('section');

        window.addEventListener('scroll', () => {
            let current = '';
            sections.forEach(section => {
                const sectionTop = section.offsetTop;
                const sectionHeight = section.clientHeight;
                if (pageYOffset >= (sectionTop - sectionHeight/3)) {
                    current = section.getAttribute('id');
                }
            });

            navLinks.forEach(link => {
                link.classList.remove('active');
                const href = link.getAttribute('href');
                if (href.includes(current)) {
                    link.classList.add('active');
                }
            });
        });
    });
</script>
