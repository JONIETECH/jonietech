<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.15.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://unpkg.com/bs-brain@2.0.4/components/services/service-5/assets/css/service-5.css">
    <link rel="stylesheet" href="assets/css/main.min.css">
    <title>JONIETECH</title>
    <script src="assets/js/nav.min.js" defer></script>
    <meta name="description" content="JONIETECH - Professional web development, mobile app development, and IT services company. We create custom solutions for businesses with expertise in React, Flutter, Node.js and more.">
    <meta name="keywords" content="web development, app development, IT services, software development, Uganda tech company, JONIETECH">
    <meta name="author" content="JONIETECH">
    

    <!-- Add schema.org markup -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "JONIETECH",
      "description": "Professional web development, mobile app development, and IT services company",
      "url": "https://jonietech.com",
      "logo": "https://jonietech.com/assets/images/icon.png",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+256765761948",
        "contactType": "customer service"
      }
    }
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        
        .construction-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            padding: 2rem;
            margin: 0;
        }
        
        .construction-content {
            text-align: center;
            max-width: 800px;
            animation: fadeIn 1.5s ease-in;
        }

        .construction-icon {
            font-size: 5rem;
            color: var(--bs-primary);
            margin-bottom: 2rem;
            animation: bounce 2s infinite;
        }

        .contact-info {
            margin-top: 3rem;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            animation: slideUp 1s ease-out;
        }

        .contact-item {
            margin: 1rem 0;
            transition: transform 0.3s ease;
        }

        .contact-item:hover {
            transform: translateY(-5px);
        }

        .contact-item i {
            color: var(--bs-primary);
            margin-right: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-30px); }
            60% { transform: translateY(-15px); }
        }

        @keyframes slideUp {
            from { 
                opacity: 0;
                transform: translateY(50px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }

        .social-links {
            margin-top: 2rem;
        }

        .social-links a {
            color: var(--bs-primary);
            font-size: 1.5rem;
            margin: 0 10px;
            transition: transform 0.3s ease;
        }

        .social-links a:hover {
            transform: scale(1.2);
        }
    </style>
</head>

<body>
    <div class="construction-container">
        <div class="construction-content">
            <i class="bi bi-tools construction-icon"></i>
            <h1 class="display-4 text-white mb-4">Under Construction</h1>
            <p class="lead text-white-50 mb-4">
                We're working hard to bring you something amazing! Our website is currently under construction.
                While we're building, feel free to reach out to us through any of the following channels:
            </p>
            
            <div class="contact-info">
                <div class="contact-item">
                    <i class="bi bi-envelope"></i>
                    <span class="text-white">Email: info@jonietech.com</span>
                </div>
                <div class="contact-item">
                    <i class="bi bi-telephone"></i>
                    <span class="text-white">Phone: +256 765 761 948</span>
                </div>
                <div class="contact-item">
                    <i class="bi bi-geo-alt"></i>
                    <span class="text-white">Location: Kampala, Uganda</span>
                </div>
            </div>

            <div class="social-links">
                <a href="#" target="_blank"><i class="bi bi-facebook"></i></a>
                <a href="#" target="_blank"><i class="bi bi-twitter"></i></a>
                <a href="#" target="_blank"><i class="bi bi-linkedin"></i></a>
                <a href="#" target="_blank"><i class="bi bi-instagram"></i></a>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
